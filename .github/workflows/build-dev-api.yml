name: Build  DEV DME HPC API workflow
permissions:
  contents: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      environment:
        description: env to build war file
        type: choice
        default: build-dev
        options:
          - build-dev
      code_branch:
        description: branch to build
        required: true
        default: master
run-name: "Build for DME API (branch: ${{ github.event.inputs.code_branch }})"
jobs:
  build:
    name: Build war file
    runs-on:
      group: cbiit-global-runners
      #labels: [self-hosted]
      labels: [nonprod-org-runner]
      #labels: [prod-org-runner]
    environment: ${{ inputs.environment }}
    env:
      CODE_BRANCH: "${{ github.event.inputs.code_branch }}"
      HPC_DRIVE_CLIENTID: ${{ secrets.HPC_DRIVE_CLIENTID }}
      HPC_DRIVE_CLIENTSECRET: ${{ secrets.HPC_DRIVE_CLIENTSECRET }}
      HPC_BOX_CLIENTID: ${{ secrets.HPC_BOX_CLIENTID }}
      HPC_BOX_CLIENTSECRET: ${{ secrets.HPC_BOX_CLIENTSECRET }}
    steps:
      - name: check git installation
        run: git --version

      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          #ref: ${{ github.event.inputs.code_branch }}
          ref: ${{ env.CODE_BRANCH }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'
      - name: set up maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.9.4'
      #- name: install ojdbc6 to local maven repo
        #run: |
          #mvn install:install-file \
            #-Dfile=/path/to/ojdbc6.jar \
            #-DgroupId=com.oracle \
            #-DartifactId=ojdbc6 \
            #-Dversion=11.2.0.4 \
            #-Dpackaging=jar

      - name: build the war file
        run: |
          #cd HPC_DME_APIs/src
          cd $GITHUB_WORKSPACE/src
          #sed -i "s|^spring.datasource.password=.*|spring.datasource.password=${{ env.SPRING_DS_PWD }}|" src/main/resources/application.properties
          sed -i "s|^gov.nih.nci.hpc.drive.clientid=.*|gov.nih.nci.hpc.drive.clientid=${{ env.HPC_DRIVE_CLIENTID }}|" hpc-web/src/main/resources/appconfigs/dev-env.conf 
          sed -i "s|^gov.nih.nci.hpc.drive.clientsecret=.*|gov.nih.nci.hpc.drive.clientsecret=${{ env.HPC_DRIVE_CLIENTSECRET }}|" hpc-web/src/main/resources/appconfigs/dev-env.conf 
          sed -i "s|^gov.nih.nci.hpc.box.clientid=.*|gov.nih.nci.hpc.box.clientid=${{ env.HPC_BOX_CLIENTID }}|" hpc-web/src/main/resources/appconfigs/dev-env.conf 
          sed -i "s|^gov.nih.nci.hpc.box.clientsecret=.*|gov.nih.nci.hpc.box.clientsecret=${{ env.HPC_BOX_CLIENTSECRET }}|" hpc-web/src/main/resources/appconfigs/dev-env.conf 
          grep "gov.nih.nci.hpc.drive.clientid=" hpc-web/src/main/resources/appconfigs/dev-env.conf
          mvn clean install -Ddev
      - name: upload artifacts for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dme-dev-hpc-api-artifacts
          path: |
            src/hpc-server/hpc-ws-rs-impl/target/*.war
            src/hpc-server/hpc-scheduler/target/*.war
            src/hpc-server/hpc-scheduler-migration/target/*.war
