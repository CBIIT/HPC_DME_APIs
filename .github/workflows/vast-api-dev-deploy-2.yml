name: Deploy VAST API DEV ON EPHEMERAL RUNNER

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: dev
        options:
          - dev
      build_run_number:
        description: "Build workflow run number that produced VAST API artifacts (or 'latest')"
        required: false
        type: string
        default: "latest"

      ncias_d3610_v_nci_nih_gov:
        description: "Deploy to ncias-d3610-v.nci.nih.gov"
        required: false
        type: boolean
        default: false

run-name: "Deploy VAST API in Dev from build #${{ inputs.build_run_number || 'latest' }} to ${{ inputs.environment }}"

env:
  AWS_REGION: us-east-1
  S3_BUCKET: git-hub-actions-artifacts-dev
  S3_FOLDER: DME/VAST            # must match the build workflow

jobs:
  prepare:
    name: Prepare selected server matrix
    runs-on:
      labels: [ec2-al2023-s-nonprod]
    outputs:
      matrix: ${{ steps.selected_servers.outputs.matrix }}
      s3_prefix: ${{ steps.check_build.outputs.s3_prefix }}
    steps:
      - name: Resolve S3 artifact location
        id: check_build
        shell: bash
        run: |
          set -euo pipefail

          input="${{ inputs.build_run_number }}"

          if [ -z "$input" ] || [ "$input" = "latest" ]; then
            echo "No specific build_run_number provided; using the latest build in S3."
            prefix="${S3_FOLDER}/latest"
          else
            if ! [[ "$input" =~ ^[0-9]+$ ]]; then
              echo "build_run_number must be 'latest' or a number." >&2
              exit 1
            fi
            echo "Using explicitly provided build_run_number: ${input}"
            prefix="${S3_FOLDER}/builds/${input}"
          fi
          echo "s3_prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "Artifacts will be read from s3://${S3_BUCKET}/${prefix}/"

      - name: Build selected server matrix
        id: selected_servers
        shell: bash
        run: |
          set -euo pipefail

          matrix='{"include":['
          separator=''

          add_server() {
            local name="$1"
            local host="$2"
            matrix="${matrix}${separator}{\"name\":\"${name}\",\"host\":\"${host}\"}"
            separator=','
          }

          if [ "${{ inputs.ncias_d3610_v_nci_nih_gov }}" = "true" ]; then
            add_server "ncias-d3610-v.nci.nih.gov" "ncias-d3610-v.nci.nih.gov"
          fi

          matrix="${matrix}]}"

          if [ "$matrix" = '{"include":[]}' ]; then
            echo "Select at least one deployment server checkbox." >&2
            exit 1
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Selected server matrix: ${matrix}"

  deploy:
    name: Deploy to ${{ matrix.name }}
    needs: prepare
    runs-on:
      labels: [ec2-al2023-s-nonprod]
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      REMOTE_TOMCAT: tomcat-dme-project
      MAX_WAIT_TIME: 20
      APP: hpc-server
      APP1: hpc-scheduler
      APP2: hpc-scheduler-migration
      DIST: /local/content/tomcat/dme-project/webapps
      UNIT: hpc-server.war
      UNIT1: hpc-scheduler.war
      UNIT2: hpc-scheduler-migration.war
      #SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_USER: ncif-hpcdm-svc
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts from S3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          aws s3 sync "s3://${S3_BUCKET}/${{ needs.prepare.outputs.s3_prefix }}/" artifacts --only-show-errors

      - name: List downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloaded artifacts:"
          find artifacts -type f | sort

      - name: Set WAR file environment
        id: wars
        shell: bash
        run: |
          set -euo pipefail

          set_war_environment() {
            local variable_prefix="$1"
            local artifact_directory="$2"
            local file_pattern="$3"
            local -a matches

            mapfile -t matches < <(
              find artifacts -type f -path "*/${artifact_directory}/target/${file_pattern}" | sort
            )

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one ${file_pattern} in ${artifact_directory}/target; found ${#matches[@]}." >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi

            local war_path="${matches[0]}"
            local war_name
            war_name="$(basename "$war_path")"

            echo "${variable_prefix}_WAR_PATH=${war_path}" >> "$GITHUB_ENV"
            echo "${variable_prefix}_WAR_NAME=${war_name}" >> "$GITHUB_ENV"
            echo "${variable_prefix}_WAR_PATH=${war_path}"
            echo "${variable_prefix}_WAR_NAME=${war_name}"
          }

          set_war_environment HPC_SERVER hpc-ws-rs-impl 'hpc-server-*.war'
          set_war_environment HPC_SCHEDULER hpc-scheduler 'hpc-scheduler-[0-9]*.war'
          set_war_environment HPC_SCHEDULER_MIGRATION hpc-scheduler-migration 'hpc-scheduler-migration-*.war'

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"

          if [ -z "${SSH_USER:-}" ]; then
            echo "DEPLOY_SSH_USER secret is required." >&2
            exit 1
          fi

          echo "Target host: ${target_host}"
          echo "Remote deploy user: ${SSH_USER}"

          # The runner image already has the SSH key; just trust the target host key
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$target_host" >> ~/.ssh/known_hosts

          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            "${SSH_USER}@${target_host}" "echo SSH connection OK"

      - name: Stop Tomcat
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"

          ssh "${SSH_USER}@${target_host}" \
            "sudo /sbin/service '${REMOTE_TOMCAT}' stop"
          echo "Tomcat stopped on ${target_host}."

      - name: Prepare application directory (remove exploded apps, old backups and symlinks, back up current WARs)
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"
          timestamp=$(date +%Y%m%d.%H%M)

          # One SSH connection runs all four clean-up/backup stages, in order.
          ssh "${SSH_USER}@${target_host}" \
            bash -s -- "${DIST}" "${SSH_USER}" "${timestamp}" \
              "${APP}" "${APP1}" "${APP2}" \
              "${UNIT}" "${UNIT1}" "${UNIT2}" <<'REMOTE'
          set -euo pipefail

          DIST="$1"; SSH_USER="$2"; timestamp="$3"
          APP="$4"; APP1="$5"; APP2="$6"
          UNIT="$7"; UNIT1="$8"; UNIT2="$9"

          cd "$DIST"

          echo "=== Remove applications directory ==="
          for application in "$APP" "$APP1" "$APP2"; do
            echo "Checking exploded directory: ${application}"
            if [ -d "$application" ]; then
              rm -rf -- "$application"
              echo "Removed directory ${application}"
            else
              echo "No exploded directory found for ${application}"
            fi
          done

          echo "=== Clean up old WAR backups ==="
          rm -f hpc-server-[0-9]*.war_backup* hpc-server-[0-9]*.war.backup*
          rm -f hpc-scheduler-[0-9]*.war_backup* hpc-scheduler-[0-9]*.war.backup*
          rm -f hpc-scheduler-migration-[0-9]*.war_backup* hpc-scheduler-migration-[0-9]*.war.backup*

          echo "=== Remove existing WAR symlinks ==="
          for unit in "$UNIT" "$UNIT1" "$UNIT2"; do
            echo "Checking symlink: ${unit}"
            if [ -L "$unit" ]; then
              rm -f -- "$unit"
              echo "Removed symlink ${unit}"
            else
              echo "No symlink found for ${unit}"
            fi
          done

          echo "=== Back up current WAR files ==="
          for pattern in "${APP}-*.war" "${APP1}-[0-9]*.war" "${APP2}-*.war"; do
            echo "Backing up existing WARs (pattern: ${pattern})"
            find . -maxdepth 1 -type f -name "$pattern" -exec mv {} {}_backup_${timestamp} \;
            find . -maxdepth 1 -type f -name "${pattern}_backup_${timestamp}" -exec chown "${SSH_USER}:${SSH_USER}" {} +
          done
          REMOTE

      - name: Copy new WARs to deployment directory
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"
          server_war="${GITHUB_WORKSPACE}/${HPC_SERVER_WAR_PATH}"
          scheduler_war="${GITHUB_WORKSPACE}/${HPC_SCHEDULER_WAR_PATH}"
          migration_war="${GITHUB_WORKSPACE}/${HPC_SCHEDULER_MIGRATION_WAR_PATH}"

          test -r "$server_war"
          test -r "$scheduler_war"
          test -r "$migration_war"

          scp -p "$server_war"    "${SSH_USER}@${target_host}:${DIST}/${HPC_SERVER_WAR_NAME}"
          scp -p "$scheduler_war" "${SSH_USER}@${target_host}:${DIST}/${HPC_SCHEDULER_WAR_NAME}"
          scp -p "$migration_war" "${SSH_USER}@${target_host}:${DIST}/${HPC_SCHEDULER_MIGRATION_WAR_NAME}"
          ssh "${SSH_USER}@${target_host}" \
            "cd '${DIST}' && chown '${SSH_USER}:${SSH_USER}' '${HPC_SERVER_WAR_NAME}' '${HPC_SCHEDULER_WAR_NAME}' '${HPC_SCHEDULER_MIGRATION_WAR_NAME}'"

      - name: Create WAR symlinks
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"

          ssh "${SSH_USER}@${target_host}" \
            "set -e; cd '${DIST}'; ln -s '${HPC_SERVER_WAR_NAME}' '${UNIT}'; ln -s '${HPC_SCHEDULER_WAR_NAME}' '${UNIT1}'; ln -s '${HPC_SCHEDULER_MIGRATION_WAR_NAME}' '${UNIT2}'"

      - name: Start Tomcat and wait for service
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"

          ssh "${SSH_USER}@${target_host}" \
            "set -e; sudo /sbin/service '${REMOTE_TOMCAT}' start; echo 'Process check:'; ps -ef | grep -E tomcat || true"
